# EpiPose training
data_dir: data/features
top_poses: 500
multi_apo: true
score_only_test: true

dim: 48
heads: 4
blocks: 2
dropout: 0.1
res_dropout: 0.2

use_delta_rank: true
lambda_delta: 0.125
rank_margin: 0.1

map_tau: 1.0

lr: 3.0e-4
weight_decay: 1.0e-2
batch_units: 8
epochs: 400
patience: 30
grad_clip: 1.0
seed: 0
gpu: 0

out_dir: runs
tag: epipose
